# A dashboard view with every repository knell announces, most recently
# pushed first; new ones appear by themselves. The heading carries the bell:
# whether its last poll went well, when it was and the rate limit left.
#
# Needs the auto-entities and Mushroom custom cards, and examples/knell.jinja
# in config/custom_templates/. Add as a view (raw configuration editor) or
# take the section alone into an existing sections view.
type: sections
title: Projects
icon: mdi:code-braces-box
path: projects
max_columns: 4
sections:
  - type: grid
    column_span: 4
    cards:
      - type: heading
        heading: Repositories
        badges:
          - type: entity
            entity: binary_sensor.knell_github_poll
          - type: entity
            entity: sensor.knell_github_last_poll
          - type: entity
            entity: sensor.knell_github_rate_limit
      - type: custom:auto-entities
        grid_options:
          columns: full
        card:
          type: grid
          columns: 3
          square: false
        card_param: cards
        sort:
          method: state
          reverse: true
        filter:
          include:
            - entity_id: sensor.knell_github_*_last_push
              options:
                type: custom:mushroom-template-card
                entity: this.entity_id
                primary: "{{ state_attr(entity, 'repository') }}"
                secondary: >-
                  {% from 'knell.jinja' import knell_summary %}{{ knell_summary(entity) }}
                icon: >-
                  {% from 'knell.jinja' import knell_icon %}{{ knell_icon(entity) }}
                icon_color: >-
                  {% from 'knell.jinja' import knell_color %}{{ knell_color(entity) }}
                badge_icon: >-
                  {% from 'knell.jinja' import knell_release_color %}{{ 'mdi:tag' if knell_release_color(entity) }}
                badge_color: >-
                  {% from 'knell.jinja' import knell_release_color %}{{ knell_release_color(entity) }}
                multiline_secondary: true
                tap_action:
                  action: more-info
